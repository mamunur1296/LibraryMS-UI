name: CI/CD - LibraryMS UI

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  IMAGE_NAME: support2026it/libraryms-ui
  DEPLOY_PATH: /home/deployment/frontend/libraryms-ui
  COMPOSE_PROJECT: libraryms-ui
  APP_PORT: "20263"
  VITE_API_BASE_URL: https://api.libraryms.example.com

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "sha_tag=develop-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "rolling_tag=develop" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.rolling_tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}

  deploy:
    needs: build-test-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
          COMPOSE_PROJECT: ${{ env.COMPOSE_PROJECT }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: develop
          APP_PORT: ${{ env.APP_PORT }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_PATH,COMPOSE_PROJECT,IMAGE_NAME,IMAGE_TAG,APP_PORT,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ -n "${DOCKERHUB_TOKEN:-}" ]; then
              printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            fi

            cat > docker-compose.yml <<EOF
            services:
              frontend:
                image: ${IMAGE_NAME}:${IMAGE_TAG}
                container_name: libraryms-ui
                restart: unless-stopped
                ports:
                  - "127.0.0.1:${APP_PORT}:80"
                healthcheck:
                  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
                  interval: 30s
                  timeout: 5s
                  start_period: 10s
                  retries: 3
                labels:
                  com.docker.compose.project: "${COMPOSE_PROJECT}"
                  com.dosiai.app: "libraryms-ui"
                  com.dosiai.domain: "libraryms.example.com"
            EOF

            docker compose -p "$COMPOSE_PROJECT" config --quiet
            docker compose -p "$COMPOSE_PROJECT" pull frontend
            docker compose -p "$COMPOSE_PROJECT" up -d --no-deps frontend

            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/healthz" >/tmp/libraryms-ui-health.txt; then
                echo "Frontend deployment healthy"
                exit 0
              fi
              sleep 2
            done

            echo "Frontend did not become healthy" >&2
            docker compose -p "$COMPOSE_PROJECT" ps >&2
            docker logs --tail 120 libraryms-ui >&2 || true
            exit 1
